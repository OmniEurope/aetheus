# SPDX-License-Identifier: EUPL-1.2
name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: aetheus_test
          POSTGRES_USER: dbaetheus_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbaetheus_test -d aetheus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.202'

      - name: Restore dependencies
        run: dotnet restore --locked-mode -p:Configuration=Release

      - name: Build (Release, warnings as errors)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Product unit tests with coverage
        run: |
          rm -rf ./coverage ./coverage-merged
          mkdir -p ./coverage
          for project in \
            tests/Aetheus.Back.Tests \
            tests/Aetheus.Front.Tests \
            tests/Aetheus.Agent.Core.Tests; do
            dotnet test "$project" -c Release --no-build \
              --filter "Category!=E2E&Category!=Integration" \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage \
              --settings coverage.runsettings \
              --logger "console;verbosity=minimal"
          done

      - name: Analyzer tests
        run: >-
          dotnet test tests/Aetheus.Analyzers.Tests -c Release --no-build
          --logger "trx;LogFileName=analyzer-results.trx"
          --results-directory ./test-results

      - name: Integration tests
        env:
          ConnectionStrings__Test: >-
            Host=localhost;Port=5432;Database=aetheus_test;
            Username=dbaetheus_test;Password=test_password
        run: >-
          dotnet test -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./test-results

      - name: Merge and enforce product coverage
        run: |
          REPORT_COUNT="$(find ./coverage -type f -name coverage.cobertura.xml | wc -l | tr -d ' ')"
          if [ "$REPORT_COUNT" -ne 3 ]; then
            echo "Expected exactly 3 product coverage reports, found $REPORT_COUNT."
            exit 1
          fi
          REPORTS="$(find ./coverage -type f -name coverage.cobertura.xml -print | sort | paste -sd ';' -)"
          dotnet tool restore
          dotnet tool run reportgenerator -- \
            "-reports:$REPORTS" \
            "-targetdir:./coverage-merged" \
            "-reporttypes:Cobertura" \
            "-assemblyfilters:+Aetheus.Back;+Aetheus.Front;+Aetheus.Agent.Core" \
            "-verbosity:Warning"
          test -s ./coverage-merged/Cobertura.xml
          sed -i '/^[[:space:]]*<!DOCTYPE coverage /d' ./coverage-merged/Cobertura.xml
          LINE_RATE="$(sed -n 's/.*line-rate="\([^"]*\)".*/\1/p' ./coverage-merged/Cobertura.xml | head -1)"
          MIN_COVERAGE=75
          awk -v rate="$LINE_RATE" -v minimum="$MIN_COVERAGE" 'BEGIN { exit !((rate * 100) >= minimum) }' || {
            echo "Line coverage is below the required 75%: $LINE_RATE"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ./test-results/*.trx
          retention-days: 14

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.202'

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt

      - name: Fail on critical vulnerabilities
        run: |
          if grep -qiE '(Critical|High)' vuln-report.txt; then
            echo "::error::Critical or high-severity vulnerable packages detected"
            exit 1
          fi

  container-vulnerability-scan:
    name: Container CVE Scan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            dockerfile: deploy/docker/Dockerfile.back
            image: aetheus-back:cve-scan
            build_args: --build-arg BUILD_AGENTS=0
          - name: front
            dockerfile: deploy/docker/Dockerfile.front
            image: aetheus-front:cve-scan
            build_args: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build production image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}"
          ${{ matrix.build_args }}
          .

      - name: Scan image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 15m
          token-setup-trivy: ${{ github.token }}

  spdx-check:
    name: SPDX Header Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check SPDX headers on source files
        run: |
          MISSING=0
          HEADER="SPDX-License-Identifier: EUPL-1.2"

          # Check .cs files (exclude obj/, bin/, Migrations/)
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -qF "$HEADER"; then
              echo "::error file=$f::Missing SPDX header"
              MISSING=$((MISSING + 1))
            fi
          done < <(find src/ tests/ -name '*.cs' \
            ! -path '*/obj/*' ! -path '*/bin/*' ! -path '*/Migrations/*')

          # Check .razor files (exclude obj/, bin/)
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -qF "$HEADER"; then
              echo "::error file=$f::Missing SPDX header"
              MISSING=$((MISSING + 1))
            fi
          done < <(find src/ tests/ -name '*.razor' \
            ! -path '*/obj/*' ! -path '*/bin/*')

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING file(s) missing SPDX header. Run: pwsh scripts/add-spdx-header.ps1"
            exit 1
          fi

          echo "All source files have SPDX headers."
