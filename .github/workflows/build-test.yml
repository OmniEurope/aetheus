# SPDX-License-Identifier: EUPL-1.2
name: Build & Test

on:
  push:
    branches: [main, develop, feature/v1]
  pull_request:
    branches: [main, develop, feature/v1]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: aetheus_test
          POSTGRES_USER: dbaetheus_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbaetheus_test -d aetheus_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.202'

      - name: Restore dependencies
        run: dotnet restore --locked-mode -p:Configuration=Release

      - name: Build (Release, warnings as errors)
        run: dotnet build -c Release --no-restore --warnaserror

      - name: Verify optional observability variants
        run: DOTNET=dotnet sh deploy/scripts/verify-optional-observability.sh

      # Suites are named explicitly rather than filtered: the E2E project needs a running
      # application, and a --filter argument would override the platform exclusion that
      # tests/Directory.Build.props applies by default (Platform!=windows on this runner).
      - name: Unit tests
        run: |
          for project in \
            tests/Aetheus.Back.Tests/Aetheus.Back.Tests.csproj \
            tests/Aetheus.Front.Tests/Aetheus.Front.Tests.csproj \
            tests/Aetheus.Agent.Core.Tests/Aetheus.Agent.Core.Tests.csproj \
            tests/Aetheus.Analyzers.Tests/Aetheus.Analyzers.Tests.csproj \
            tests/Aetheus.Telemetry.Tests/Aetheus.Telemetry.Tests.csproj \
            tests/Aetheus.WebAnalytics.Tests/Aetheus.WebAnalytics.Tests.csproj
          do
            name="$(basename "$project" .csproj)"
            dotnet test "$project" -c Release --no-build \
              --logger "trx;LogFileName=$name.trx" \
              --results-directory ./test-results
          done

      - name: Integration tests
        env:
          ConnectionStrings__Test: >-
            Host=localhost;Port=5432;Database=aetheus_test;
            Username=dbaetheus_test;Password=test_password
        run: >-
          dotnet test tests/Aetheus.Back.IntegrationTests/Aetheus.Back.IntegrationTests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=integration-results.trx"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: ./test-results/*.trx
          retention-days: 14

  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.202'

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt

      - name: Fail on critical vulnerabilities
        run: |
          if grep -qiE '(Critical|High)' vuln-report.txt; then
            echo "::error::Critical or high-severity vulnerable packages detected"
            exit 1
          fi

  container-vulnerability-scan:
    name: Container CVE Scan (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: back
            dockerfile: deploy/docker/Dockerfile.back
            image: aetheus-back:cve-scan
            build_args: --build-arg BUILD_AGENTS=0
          - name: front
            dockerfile: deploy/docker/Dockerfile.front
            image: aetheus-front:cve-scan
            build_args: ''
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build production image
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}"
          ${{ matrix.build_args }}
          .

      - name: Scan image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 15m
          token-setup-trivy: ${{ github.token }}

  spdx-check:
    name: SPDX Header Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check SPDX headers on source files
        run: |
          MISSING=0
          HEADER="SPDX-License-Identifier: EUPL-1.2"

          # Check .cs files (exclude obj/, bin/, Migrations/)
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -qF "$HEADER"; then
              echo "::error file=$f::Missing SPDX header"
              MISSING=$((MISSING + 1))
            fi
          done < <(find src/ tests/ -name '*.cs' \
            ! -path '*/obj/*' ! -path '*/bin/*' ! -path '*/Migrations/*')

          # Check .razor files (exclude obj/, bin/)
          while IFS= read -r f; do
            if ! head -5 "$f" | grep -qF "$HEADER"; then
              echo "::error file=$f::Missing SPDX header"
              MISSING=$((MISSING + 1))
            fi
          done < <(find src/ tests/ -name '*.razor' \
            ! -path '*/obj/*' ! -path '*/bin/*')

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING file(s) missing SPDX header. Run: pwsh scripts/add-spdx-header.ps1"
            exit 1
          fi

          echo "All source files have SPDX headers."
