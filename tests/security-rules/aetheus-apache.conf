# Test corpus for .aetheus/security-rules/opengrep/aetheus-apache.yml (opengrep scan --test).
# ruleid: aetheus.apache.https-vhost-without-hsts
<VirtualHost *:443>
    ServerName bare.example.org
    ProxyPass / http://127.0.0.1:8080/
</VirtualHost>

# ruleid: aetheus.apache.https-vhost-without-hsts
<VirtualHost *:443>
    ServerName cached.example.org
    Header always set Cache-Control "no-cache"
</VirtualHost>

# ok: aetheus.apache.https-vhost-without-hsts
<VirtualHost *:443>
    ServerName default.invalid
    <Location "/">
        Require all denied
    </Location>
</VirtualHost>

# ok: aetheus.apache.https-vhost-without-hsts
<VirtualHost *:443>
    ServerName hardened.example.org
    Header always set Strict-Transport-Security "max-age=31536000"
    AllowEncodedSlashes NoDecode
    # ok: aetheus.apache.encoded-slashes-without-nocanon
    ProxyPass / http://127.0.0.1:8080/ nocanon
</VirtualHost>

<VirtualHost *:80>
    ServerName legacy.example.org
    AllowEncodedSlashes NoDecode
    # ruleid: aetheus.apache.encoded-slashes-without-nocanon
    ProxyPass / http://127.0.0.1:8081/
</VirtualHost>
