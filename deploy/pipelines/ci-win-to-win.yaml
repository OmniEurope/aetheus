name: ci-win-to-win
trigger: manual
variable_libraries:
  - deploy-config
vaults:
  - ci-secrets
stages:
  # ── Build (Windows) ──
  - name: Compile
    group: Build
    os: windows
    steps:
      - name: Restore & Build
        shell: dotnet build $(WORKSPACE)/Aetheus.slnx --configuration Release --nologo -v q
        working_directory: $(WORKSPACE)
        timeout_seconds: 300

  - name: Tests
    group: Build
    os: windows
    depends_on:
      - Compile
    steps:
      - name: Run Back Tests
        shell: dotnet test $(WORKSPACE)/tests/Aetheus.Back.Tests --no-build -c Release -v normal --logger "console;verbosity=detailed"
        timeout_seconds: 300
      - name: Run Front Tests
        shell: dotnet test $(WORKSPACE)/tests/Aetheus.Front.Tests --no-build -c Release -v normal --logger "console;verbosity=detailed"
        timeout_seconds: 300
      - name: Run Agent Tests
        shell: dotnet test $(WORKSPACE)/tests/Aetheus.Agent.Core.Tests --no-build -c Release -v normal --logger "console;verbosity=detailed"
        timeout_seconds: 300

  - name: Coverage
    group: Build
    os: windows
    depends_on:
      - Tests
    steps:
      - name: Collect Coverage
        shell: |
          dotnet test $(WORKSPACE)/tests/Aetheus.Back.Tests --no-build -c Release -v q --collect:"XPlat Code Coverage" --results-directory $(WORKSPACE)/coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $(WORKSPACE)/tests/Aetheus.Front.Tests --no-build -c Release -v q --collect:"XPlat Code Coverage" --results-directory $(WORKSPACE)/coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $(WORKSPACE)/tests/Aetheus.Agent.Core.Tests --no-build -c Release -v q --collect:"XPlat Code Coverage" --results-directory $(WORKSPACE)/coverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem -Path $(WORKSPACE)/coverage -Recurse -Filter coverage.cobertura.xml)
          if ($reports.Count -ne 3) { Write-Error "Expected exactly 3 coverage reports, found $($reports.Count)."; exit 1 }
        timeout_seconds: 300
      - name: Publish Coverage
        type: coverage
        continue_on_error: true

  - name: Lint
    group: Build
    os: windows
    depends_on:
      - Compile
    steps:
      - name: Check Formatting
        shell: dotnet format $(WORKSPACE)/Aetheus.slnx --verify-no-changes --no-restore -v diag
        timeout_seconds: 120
        continue_on_error: true

  - name: QualityGate
    group: Quality
    os: windows
    depends_on:
      - Coverage
      - Lint
    steps:
      - name: Publish the advisory coverage grade
        type: analysis-gate
        analysis_scope: quality
        analysis_grading:
          version: 1
          minimum_grade: F
          required_domains:
            - reliability
          rules:
            - key: grade.coverage.line
              domain: reliability
              metric: coverage.line.percent
              category: coverage
              direction: higher-is-better
              a: 75
              b: 65
              c: 55
              d: 40
              e: 20
        continue_on_error: true
        timeout_seconds: 300

  - name: Publish
    group: Build
    os: windows
    depends_on:
      - QualityGate
    artifacts:
      - $(WORKSPACE)/publish/back
    steps:
      - name: Publish Back
        shell: dotnet publish $(WORKSPACE)/src/Aetheus.Back -c Release -o $(WORKSPACE)/publish/back --nologo -v q
        timeout_seconds: 120

  - name: Release
    group: Build
    os: windows
    depends_on:
      - Publish
    steps:
      - name: Create Release
        type: release
        version: "1.0.$(BUILD_BUILDID)"
        changelog: true

  # ── Deploy (Windows) ──
  - name: Substitute
    group: Deploy
    os: windows
    depends_on:
      - Release
    steps:
      - name: Variable Substitution
        type: substitute
        target_files:
          - $(WORKSPACE)/publish/back/appsettings.json

  - name: Deploy
    group: Deploy
    os: windows
    depends_on:
      - Substitute
    steps:
      - name: Stop Service
        shell: Stop-Service -Name "AetheusBack" -Force -ErrorAction SilentlyContinue
        timeout_seconds: 30
        continue_on_error: true
      - name: Copy Files
        shell: >-
          robocopy $(WORKSPACE)/publish/back $(DEPLOY_DIR) /MIR /NFL /NDL /NJH /NJS /NP ;
          if ($LASTEXITCODE -le 7) { $LASTEXITCODE = 0 }
        timeout_seconds: 120
      - name: Start Service
        shell: Start-Service -Name "AetheusBack"
        timeout_seconds: 30
