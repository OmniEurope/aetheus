# =============================================================================
# toto-legacy-accept-deploy-fast - fast local acceptance deployment for Toto
# =============================================================================
# Local mirror of aetheus-release-fast. It deliberately skips Toto CI and QA,
# but still builds from the checked-out revision, waits for Docker Compose health
# and proves the application readiness endpoint. It targets the disposable
# "accept" environment only; it must never be imported as a production pipeline.
name: toto-legacy-accept-deploy-fast
trigger: manual

stages:
  - name: Verify
    os: linux
    environment: accept
    steps:
      - name: Check Docker Compose v2
        shell: "docker --version && docker compose version"
        timeout_seconds: 60

  - name: Deploy
    os: linux
    group: Deploy
    environment: accept
    depends_on:
      - Verify
    steps:
      - name: Build checked-out revision and start stack
        checkout: true
        working_directory: "$(WORKSPACE)"
        timeout_seconds: 1800
        shell: |
          set -eu
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          case "$SOURCE_COMMIT" in
            *[!0-9a-fA-F]*|'') echo "Invalid checked-out source revision."; exit 1 ;;
          esac
          docker build -f deploy/Dockerfile -t toto-accept:fast-$SOURCE_COMMIT .
          export TOTO_IMAGE="toto-accept:fast-$SOURCE_COMMIT"
          docker compose -p toto-accept -f deploy/docker-compose.yml up -d --wait

  - name: Readiness
    os: linux
    group: Smoke
    environment: accept
    depends_on:
      - Deploy
    steps:
      - name: Verify local readiness
        timeout_seconds: 120
        shell: |
          set -eu
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/api/todos >/dev/null; then
              echo "Fast acceptance readiness passed."; exit 0
            fi
            sleep 2
          done
          echo "Fast acceptance readiness failed."; exit 1
