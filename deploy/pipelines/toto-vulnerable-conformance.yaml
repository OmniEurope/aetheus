# Negative-grade laboratory: real findings must degrade the gate note without blocking delivery.
name: toto-vulnerable-conformance
trigger: manual

stages:
  - name: CI
    os: linux
    steps:
      - name: Prove the vulnerable source still builds and tests
        type: trigger
        pipeline: toto-ci
        timeout_seconds: 3600

  - name: QualityEvidence
    group: Quality
    os: linux
    depends_on: [CI]
    steps:
      - name: Produce real quality evidence and record the degraded gate note
        type: trigger
        pipeline: toto-quality
        continue_on_error: true
        timeout_seconds: 3600

  - name: SecurityEvidence
    group: Security
    os: linux
    depends_on: [CI]
    steps:
      - name: Produce real security findings and record the degraded gate note
        type: trigger
        pipeline: toto-security
        continue_on_error: true
        timeout_seconds: 3600
