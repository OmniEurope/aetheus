services:
  toto-api:
    image: "toto-qa:${AETHEUS_RUN_ID:-current}"
    ports:
      - "127.0.0.1:${TOTO_PORT:?TOTO_PORT must be assigned per pipeline run}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/todos >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
