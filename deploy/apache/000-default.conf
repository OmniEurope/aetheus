# Neutral default vhost. Keep this file lexically before application vhosts so
# requests with an unknown Host header or SNI name cannot reach an application.
<VirtualHost *:80>
    ServerName default.invalid
    <Location "/">
        Require all denied
    </Location>
    ErrorDocument 403 "Unknown host"
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName default.invalid
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/aetheus.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/aetheus.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    <Location "/">
        Require all denied
    </Location>
    ErrorDocument 403 "Unknown host"
</VirtualHost>
</IfModule>
