# SPDX-License-Identifier: EUPL-1.2
# Reusable blue-green host deployment, expressed entirely with native step types.
#
# The three deployment paths that preceded this each re-implemented the same cutover in shell, and
# they drifted: one omitted the frontend cache contract another enforced, and one let a response-time
# budget roll back a deployment that was serving correctly. Shell also cannot be shared between
# projects, so every new project inherited a copy of the drift.
#
# A consuming pipeline supplies its own identity through the variables below and extends this
# template; nothing here is specific to any one application.
name: host-bluegreen-deploy-template
trigger: manual

parameters:
  - name: revision
    display_name: Revision being deployed
    type: string
    required: true

variables:
  # Identity of the environment. Every one of these is required: the agent refuses a scope it cannot
  # validate before it touches a live environment.
  BG_PROJECT: ""
  BG_STATE_DIR: ""
  BG_ENV_FILE: ""
  BG_COMPOSE_FILES: ""
  BG_PORTS: ""
  # No default: the agent resolves this path itself and a missing directory now fails the gate rather
  # than reading as "nothing pending". A consuming pipeline supplies the path its own repository uses.
  BG_MIGRATIONS_DIR: ""
  BG_UPSTREAM_TEMPLATE: ""
  BG_UPSTREAM_CONF: ""
  BG_RELOAD_HELPER: ""
  # Public origin the evidence stages probe once traffic has moved.
  BG_PUBLIC_ORIGIN: ""
  BG_PERFORMANCE_SAMPLES: "10"
  BG_PERFORMANCE_MAX_SECONDS: "2"
  # Empty skips the authenticated browser suite.
  BG_BROWSER_IMAGE: ""
  # What a smoke finding costs. `blocking` is the default here because the Rollback stage below is the
  # only compensation this template has, and it can only fire on a failed stage: an evidence stage that
  # can never fail makes the rollback decorative. The response-time budget stays advisory whatever this
  # is set to, so a slow sample still cannot undo a deployment that is serving.
  BG_SMOKE_GATE: "blocking"
  BG_REVISION: "${{ parameters.revision }}"

stages:
  - name: Migrate
    group: Deploy
    execution_role: deploy
    os: linux
    steps:
      # Brings up the shared database and reconciles the schema. The expand/contract gate runs here:
      # both colours share this schema and the previous one keeps serving while the new one migrates,
      # so a pending Up() that drops or renames is refused rather than backed up and applied.
      - name: Reconcile the shared schema
        type: bluegreen-migrate
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        migrations_dir: "$(BG_MIGRATIONS_DIR)"
        timeout_seconds: 3600

  - name: Up
    group: Deploy
    execution_role: deploy
    os: linux
    depends_on: [Migrate]
    steps:
      # Starts the idle colour and holds until it is ready on its own ports. The live colour is never
      # touched, so a failure here leaves the current deployment serving.
      - name: Start and health-gate the idle colour
        type: bluegreen-up
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        timeout_seconds: 3600

  - name: Switch
    group: Deploy
    execution_role: deploy
    os: linux
    depends_on: [Up]
    steps:
      # Rendering the upstream configuration IS the switch; the reload only applies it. The reload is
      # self-validating, so a rejected configuration keeps the previous colour serving.
      - name: Point traffic at the idle colour
        type: bluegreen-switch
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        upstream_template: "$(BG_UPSTREAM_TEMPLATE)"
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        revision: "$(BG_REVISION)"
        timeout_seconds: 600

  - name: Evidence
    group: Smoke
    execution_role: deploy
    os: linux
    depends_on: [Switch]
    steps:
      # Graded, not merely recorded: a deployment that does not answer, breaks the frontend cache
      # contract or fails the browser suite fails this stage, which is what hands control to Rollback.
      # A slow sample is still only a finding - that budget once undid a deployment that was serving
      # correctly, and it never gets to do so again.
      - name: Probe the deployed application
        type: smoke
        origin: "$(BG_PUBLIC_ORIGIN)"
        samples: "$(BG_PERFORMANCE_SAMPLES)"
        max_seconds: "$(BG_PERFORMANCE_MAX_SECONDS)"
        frontend: true
        browser_image: "$(BG_BROWSER_IMAGE)"
        evidence_gate: "$(BG_SMOKE_GATE)"
        timeout_seconds: 3600

  - name: Commit
    group: Deploy
    execution_role: deploy
    os: linux
    depends_on: [Evidence]
    steps:
      # Records the deployed revision, stops the replaced colour and clears the journal. It runs
      # after the evidence stage precisely so a finding can never undo a cutover already serving.
      - name: Close the deployment transaction
        type: bluegreen-commit
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        timeout_seconds: 600

  - name: Rollback
    group: Deploy
    execution_role: deploy
    os: linux
    condition: "failed()"
    # Commit, not Switch. A failure handler resolves its dependencies against TERMINAL stages, so it
    # becomes eligible once the stage it names has settled either way, and its condition is answered
    # then. Naming Switch would answer it the moment the switch succeeded - before Evidence or Commit
    # could fail - and retire the rollback on a still-green run. Naming the LAST stage it guards keeps
    # it pending through Evidence and Commit and fires it on a failure of either.
    depends_on: [Commit]
    steps:
      # It restarts the previous colour, health-gates it, and restores the exact configuration
      # snapshotted in the journal before moving traffic back, so a failed deployment cannot become an
      # outage.
      - name: Restore the previous colour
        type: bluegreen-rollback
        project: "$(BG_PROJECT)"
        state_dir: "$(BG_STATE_DIR)"
        env_file: "$(BG_ENV_FILE)"
        compose_files: "$(BG_COMPOSE_FILES)"
        ports: "$(BG_PORTS)"
        upstream_conf: "$(BG_UPSTREAM_CONF)"
        reload_helper: "$(BG_RELOAD_HELPER)"
        timeout_seconds: 1800
