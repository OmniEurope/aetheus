# SPDX-License-Identifier: EUPL-1.2
name: application-candidate-template
trigger: manual
parameters:
  - name: performance
    display_name: Run the optional performance smoke
    type: boolean
    default: "false"
variables:
  APPLICATION_CI_PIPELINE: application-ci
  APPLICATION_QUALITY_PIPELINE: application-quality
  APPLICATION_SECURITY_PIPELINE: application-security
  APPLICATION_QA_PIPELINE: application-qa
  APPLICATION_ARTIFACT_NAME: Package-artifacts
  CANDIDATE_VERSION: "c-$(BUILD_SOURCEVERSION)"

stages:
  - name: Baseline
    group: Source
    execution_role: build
    os: linux
    steps:
      - name: Restore factually deployed baseline contract
        type: restore-artifacts
        release: current-deployed
        target_directory: .delivery-baseline
        allow_missing: true
        timeout_seconds: 1200
      - name: Export immutable baseline identity
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          CONTRACT=".delivery-baseline/.pipeline-artifacts/delivery-contract.json"
          if test -s "$CONTRACT"; then
            node - "$CONTRACT" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const path = process.argv[2];
          const bytes = fs.readFileSync(path);
          const contract = JSON.parse(bytes);
          console.log("##aetheus[setvariable name=DELIVERY_BASELINE_BOOTSTRAP]false");
          console.log(`##aetheus[setvariable name=DELIVERY_BASELINE_CANDIDATE_VERSION]${contract.candidateVersion}`);
          console.log(`##aetheus[setvariable name=DELIVERY_BASELINE_SOURCE_SHA]${contract.sourceSha}`);
          console.log(`##aetheus[setvariable name=DELIVERY_BASELINE_CONTRACT_SHA256]${crypto.createHash("sha256").update(bytes).digest("hex")}`);
          NODE
          else
            echo "##aetheus[setvariable name=DELIVERY_BASELINE_BOOTSTRAP]true"
          fi
        timeout_seconds: 120

  - name: CI
    group: Build
    execution_role: build
    os: linux
    depends_on: [Baseline]
    steps:
      - name: Build, test and package exact source
        type: trigger
        pipeline: "$(APPLICATION_CI_PIPELINE)"
        variables:
          DELIVERY_BASELINE_BOOTSTRAP: "$(DELIVERY_BASELINE_BOOTSTRAP)"
          DELIVERY_BASELINE_CANDIDATE_VERSION: "$(DELIVERY_BASELINE_CANDIDATE_VERSION)"
          DELIVERY_BASELINE_SOURCE_SHA: "$(DELIVERY_BASELINE_SOURCE_SHA)"
          DELIVERY_BASELINE_CONTRACT_SHA256: "$(DELIVERY_BASELINE_CONTRACT_SHA256)"
        timeout_seconds: 7200

  - name: Quality
    group: Quality
    execution_role: build
    os: linux
    depends_on: [CI]
    steps:
      - name: Produce quality evidence and publish its grade
        type: trigger
        pipeline: "$(APPLICATION_QUALITY_PIPELINE)"
        continue_on_error: true
        timeout_seconds: 7200

  - name: Security
    group: Security
    execution_role: build
    os: linux
    depends_on: [CI]
    steps:
      - name: Produce security evidence and publish its grade
        type: trigger
        pipeline: "$(APPLICATION_SECURITY_PIPELINE)"
        continue_on_error: true
        timeout_seconds: 7200

  - name: QA
    group: QA
    execution_role: build
    os: linux
    depends_on: [Quality, Security]
    steps:
      - name: Validate V, dynamic security, rollback V-1 and teardown
        type: trigger
        pipeline: "$(APPLICATION_QA_PIPELINE)"
        variables:
          APPLICATION_PERFORMANCE_ENABLED: "${{ parameters.performance }}"
        timeout_seconds: 18000

  - name: Candidate
    group: Release
    execution_role: build
    os: linux
    depends_on: [QA]
    steps:
      - name: Publish immutable undeployed candidate
        type: release
        version: "$(CANDIDATE_VERSION)"
        changelog: true
        deployed: false
        artifact: "$(APPLICATION_ARTIFACT_NAME)"
        artifact_source_pipeline: "$(APPLICATION_CI_PIPELINE)"
        timeout_seconds: 300
