# SPDX-License-Identifier: EUPL-1.2
name: application-ci-template
trigger: manual
variables:
  APPLICATION_HAS_FRONTEND: "true"
  APPLICATION_HAS_BACKEND: "true"
  APPLICATION_HAS_DATABASE: "false"

stages:
  - name: ApplicationPayload
    group: Build
    execution_role: build
    os: linux
    artifacts:
      - ".pipeline-artifacts/**"
    steps:
      - name: Run project CI adapter
        working_directory: "$(WORKSPACE)"
        shell: |
          set -eu
          test -f .pipeline/scripts/ci.sh
          APPLICATION_HAS_FRONTEND="$(APPLICATION_HAS_FRONTEND)" \
          APPLICATION_HAS_BACKEND="$(APPLICATION_HAS_BACKEND)" \
          APPLICATION_HAS_DATABASE="$(APPLICATION_HAS_DATABASE)" \
            sh .pipeline/scripts/ci.sh
          test -d .pipeline-artifacts
          find .pipeline-artifacts -type f -print -quit | grep -q .
        timeout_seconds: 7200
